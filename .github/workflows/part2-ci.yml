name: RaceDay .NET CI

on:
  push:
    branches: [ "main", "master", "dev", "part-2" ]
  pull_request:
    branches: [ "main", "master", "dev", "part-2" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Checkout repository code
    - uses: actions/checkout@v4

    # Setup .NET 8 SDK
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Restore dependencies for both API and Test projects
    - name: Restore Dependencies
      run: |
        dotnet restore RaceDay.API/RaceDay.API.csproj
        dotnet restore RaceDay.Tests/RaceDay.Tests.csproj

    # Build the projects
    - name: Build Projects
      run: |
        dotnet build RaceDay.API/RaceDay.API.csproj --configuration Release --no-restore
        dotnet build RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-restore

    # Run xUnit tests
    - name: Run Unit Tests
      run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-build --verbosity normal
