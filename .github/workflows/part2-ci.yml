name: RaceDay .NET CI
 
on:
  push:
    branches: ["main", "master", "dev", "part-2"]
  pull_request:
    branches: ["main", "master", "dev", "part-2"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Detect .NET solution or project
        id: detect
        shell: bash
        run: |
          echo "Searching for .sln, .csproj, .fsproj files..."
          # Try to find a solution first (root or tracked)
          sln=$(git ls-files '*.sln' || true)
          if [ -n "$sln" ]; then
            echo "solution=$(echo "$sln" | head -n1)" >> "$GITHUB_OUTPUT"
            echo "has_project=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Otherwise search for project files recursively
          proj=$(git ls-files '*.csproj' '*.fsproj' || true)
          if [ -n "$proj" ]; then
            echo "project=$(echo "$proj" | head -n1)" >> "$GITHUB_OUTPUT"
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
            echo "No .NET solution or project file found."
          fi

      - name: Restore NuGet Packages
        if: steps.detect.outputs.has_project == 'true'
        run: dotnet restore

      - name: Build
        if: steps.detect.outputs.has_project == 'true'
        shell: bash
        run: |
          if [ -n "${{ steps.detect.outputs.solution }}" ]; then
            dotnet build "${{ steps.detect.outputs.solution }}" --configuration Release --no-restore
          else
            dotnet build "${{ steps.detect.outputs.project }}" --configuration Release --no-restore
          fi

      - name: Run Tests
        if: steps.detect.outputs.has_project == 'true'
        shell: bash
        run: |
          if [ -n "${{ steps.detect.outputs.solution }}" ]; then
            dotnet test "${{ steps.detect.outputs.solution }}" --configuration Release --no-build --verbosity normal
          else
            dotnet test "${{ steps.detect.outputs.project }}" --configuration Release --no-build --verbosity normal
          fi

      - name: No .NET project found
        if: steps.detect.outputs.has_project != 'true'
        run: echo "No .NET solution/project found. Skipping restore/build/test."
