name: Validate Repository Documentation Structure

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify /docs Folder and Submissions
        run: |
          echo "Starting CI/CD validation check..."

          # 1. Check if /docs folder exists
          if [ ! -d "docs" ]; then
            echo "::error:: The /docs folder does not exist at the root level."
            exit 1
          fi

          # 2. Check for ANY SQL script file (*.sql)
          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "::error:: No .sql database script found in /docs!"
            exit 1
          fi

          # 3. Check for ANY ERD image or PDF file (*.png, *.jpg, *.jpeg, *.pdf)
          if ! ls docs/*.png docs/*.jpg docs/*.jpeg docs/*.pdf 1> /dev/null 2>&1; then
            echo "::error:: No ERD file (.png, .jpg, or .pdf) found in /docs!"
            exit 1
          fi

          # 4. Check for ANY Markdown file (*.md)
          if ! ls docs/*.md 1> /dev/null 2>&1; then
            echo "::error:: No API Plan (.md) file found in /docs!"
            exit 1
          fi

          echo "SUCCESS: All required planning assets are present in /docs!"
