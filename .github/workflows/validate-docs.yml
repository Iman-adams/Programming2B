name: Validate Repository Documentation Structure

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify /docs Folder and Submissions
        run: |
          echo "Starting CI/CD validation check..."

          if [ ! -d "docs" ]; then
            echo "::error:: The /docs folder does not exist at the root level."
            exit 1
          fi

          if [ ! -f "docs/RaceDay_ERD.png" ] && [ ! -f "docs/RaceDay_ERD.pdf" ]; then
            echo "::error:: ERD file is missing in /docs."
            exit 1
          fi

          if [ ! -f "docs/API_Plan.md" ] && [ ! -f "docs/API_Plan.pdf" ]; then
            echo "::error:: API Plan file is missing in /docs."
            exit 1
          fi

          if [ ! -f "docs/RaceDay_Schema.sql" ]; then
            echo "::error:: SQL Script file is missing in /docs."
            exit 1
          fi

          echo "SUCCESS: All required planning documents exist in the /docs folder!"
